# Versions in one place. AndroidX versions are the newest that still support minSdk 21.
[versions]
agp = "9.5.1"
appcompat = "1.7.0"
core = "1.13.1"
preference = "1.2.1"
autofill = "1.1.0"
material = "1.12.0"
recyclerview = "1.3.2"
junit = "4.13.2"
robolectric = "4.13"
androidxTestCore = "1.6.1"
androidxTestRunner = "1.5.2"
androidxTestJunit = "1.1.5"
espresso = "3.5.1"

[libraries]
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
core = { module = "androidx.core:core", version.ref = "core" }
preference = { module = "androidx.preference:preference", version.ref = "preference" }
autofill = { module = "androidx.autofill:autofill", version.ref = "autofill" }
material = { module = "com.google.android.material:material", version.ref = "material" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
