# Manual build: tests, then an APK (signed with the release key from the repo secrets when
# they're set, otherwise a debug build), optionally published as a GitHub release.
#
# Runs only when started by hand (Actions > Build > Run workflow), and only for the repo
# owner: anyone else's run stops at the first step. Nothing runs on push, pull requests
# or tags, so it costs no Actions minutes unless you start it.
#
# Secrets (Settings > Secrets and variables > Actions), all optional:
#   KEYSTORE_BASE64    the release keystore, base64-encoded (base64 -w0 my.jks)
#   KEYSTORE_PASSWORD  its password
#   KEY_ALIAS          the key's alias
#   KEY_PASSWORD       the key's password
name: Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v1.0); leave empty for just an APK artifact"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    # Only the repo owner may run this (others with access to the repo can't).
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write   # for the optional release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No KEYSTORE_BASE64 secret: building a debug APK instead."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          "$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk out/hackerskeyboard2-az.apk

      - name: Build debug APK
        if: steps.keystore.outputs.signed != 'true'
        run: |
          ./gradlew assembleDebug
          mkdir -p out && cp app/build/outputs/apk/debug/app-debug.apk out/hackerskeyboard2-az-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Publish GitHub release
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: out/*.apk
          generate_release_notes: true
