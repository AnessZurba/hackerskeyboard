plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'kr.jcb1ee.hackerskeyboard2'
    compileSdk = 37
    // Pinned so native builds are reproducible (16 KB pages need r28+; see CMakeLists.txt).
    ndkVersion = '29.0.13599879'
    defaultConfig {
        applicationId = 'kr.jcb1ee.hackerskeyboard2.az'
        // Settings screens link to their sub-screens by package; see res/xml/prefs.xml.
        resValue 'string', 'app_package', applicationId
        minSdk = 24
        targetSdk = 35
        versionCode = 2000000
        versionName = "v2.0.0"
        // Shown on the main screen and in settings.
        resValue 'string', 'auto_version', versionName
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    // Release signing only when the key is provided (the Build workflow sets these from the
    // repo secrets); otherwise a release build is simply unsigned instead of failing late.
    def keystorePath = System.getenv("KEYSTORE_PATH")
    signingConfigs {
        if (keystorePath) {
            release {
                storeFile = file(keystorePath)
                storePassword = System.getenv("KEYSTORE_PASSWORD")
                keyAlias = System.getenv("KEY_ALIAS")
                keyPassword = System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (keystorePath) signingConfig = signingConfigs.release
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path = "CMakeLists.txt"
        }
    }
    buildFeatures {
        resValues = true // app_package and auto_version below
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    lint {
        // Today's findings are recorded in lint-baseline.xml; only new ones fail the build.
        baseline = file("lint-baseline.xml")
        checkReleaseBuilds = true
        abortOnError = true
    }
}

android.testOptions.unitTests.includeAndroidResources = true
// Robolectric downloads its Android runtime jar at test time; pass
// -ProbolectricDeps=<dir holding the jar> to run offline instead.
android.testOptions.unitTests.all {
    if (project.hasProperty('robolectricDeps')) {
        systemProperty 'robolectric.offline', 'true'
        systemProperty 'robolectric.dependency.dir', project.property('robolectricDeps')
    }
    if (project.hasProperty('renderOut')) systemProperty 'renderOut', project.property('renderOut')
    if (project.hasProperty('renderPanel')) systemProperty 'renderPanel', project.property('renderPanel')
    // -PupdateGolden rewrites golden files (KeyOutputTest) instead of comparing with them.
    if (project.hasProperty('updateGolden')) systemProperty 'updateGolden', 'true'
}

dependencies {
    implementation libs.appcompat
    implementation libs.core
    implementation libs.preference
    // Inline autofill suggestions (password managers' chips in the toolbar), Android 11+.
    implementation libs.autofill
    implementation libs.material
    implementation libs.recyclerview
    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.espresso.core
}
