plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'kr.jcb1ee.hackerskeyboard2'
    compileSdk = 37
    // Pinned so native builds are reproducible (16 KB pages need r28+; see CMakeLists.txt).
    ndkVersion = '29.0.13599879'
    defaultConfig {
        applicationId = 'kr.jcb1ee.hackerskeyboard2.az'
        // Settings screens link to their sub-screens by package; see res/xml/prefs.xml.
        resValue 'string', 'app_package', applicationId
        minSdk = 24
        targetSdk = 36
        versionCode = 2000000
        versionName = "v2.0.0"
        // Shown on the main screen and in settings.
        resValue 'string', 'auto_version', versionName
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    // Release signing only when the key is provided (the Build workflow sets these from the
    // repo secrets); otherwise a release build is simply unsigned instead of failing late.
    def keystorePath = System.getenv("KEYSTORE_PATH")
    signingConfigs {
        if (keystorePath) {
            release {
                storeFile = file(keystorePath)
                storePassword = System.getenv("KEYSTORE_PASSWORD")
                keyAlias = System.getenv("KEY_ALIAS")
                keyPassword = System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (keystorePath) signingConfig = signingConfigs.release
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path = "CMakeLists.txt"
            version = "3.22.1" // the SDK's CMake; pinned like the NDK
        }
    }
    androidResources {
        // The AOSP dictionaries are mapped straight out of the APK, so they must be stored.
        noCompress += 'dict'
    }
    buildFeatures {
        resValues = true // app_package and auto_version below
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    lint {
        // Today's findings are recorded in lint-baseline.xml; only new ones fail the build.
        baseline = file("lint-baseline.xml")
        checkReleaseBuilds = true
        abortOnError = true
        // New strings start in English; the old translations aren't maintained, and a
        // missing one falls back to English, so this shouldn't fail the build.
        warning += 'MissingTranslation'
    }
}

// The JVM unit tests run the AOSP decoder (app/src/main/cpp/aosp) as a desktop library built
// here with the machine's CMake and C++ compiler. Without them the task does nothing and the
// suggestion tests are skipped. The build lives in the root build/ dir, so "clean" keeps it.
def hostJniDir = rootProject.layout.buildDirectory.dir('host-jni').get().asFile
def hostJniLib = new File(hostJniDir, System.getProperty('os.name').toLowerCase().contains('mac')
        ? 'libjni_latinime.dylib' : 'libjni_latinime.so')
def onPath = { String tool ->
    System.getenv('PATH').split(File.pathSeparator).any { new File(it, tool).canExecute() }
}
tasks.register('hostSuggestJni') {
    description = 'Builds libjni_latinime for this machine, for the unit tests.'
    def src = file('src/main/cpp/aosp')
    inputs.dir(src)
    outputs.file(hostJniLib)
    onlyIf { onPath('cmake') && (onPath('c++') || onPath('clang++') || onPath('g++')) }
    doLast {
        def include = "${System.getProperty('java.home')}/include"
        def platform = new File(include).listFiles()?.find { it.isDirectory() }
        def cmakeArgs = ['cmake', '-S', src.path, '-B', hostJniDir.path, '-DHK_HOST_JNI=ON',
                         '-DCMAKE_BUILD_TYPE=Release',
                         "-DJNI_INCLUDE_DIRS=${include}${platform ? ';' + platform : ''}"]
        if (onPath('clang++')) cmakeArgs << '-DCMAKE_CXX_COMPILER=clang++'
        providers.exec { commandLine cmakeArgs }.result.get()
        providers.exec {
            commandLine 'cmake', '--build', hostJniDir.path, '--parallel',
                    "${Runtime.runtime.availableProcessors()}"
        }.result.get()
    }
}

android.testOptions.unitTests.includeAndroidResources = true
// Robolectric downloads its Android runtime jar at test time; pass
// -ProbolectricDeps=<dir holding the jar> to run offline instead.
android.testOptions.unitTests.all {
    // Robolectric's Android 16 runtime reaches into FileDescriptor internals.
    jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED', '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
    dependsOn 'hostSuggestJni'
    systemProperty 'hk.suggest.hostJni', hostJniLib.path
    if (project.hasProperty('robolectricDeps')) {
        systemProperty 'robolectric.offline', 'true'
        systemProperty 'robolectric.dependency.dir', project.property('robolectricDeps')
    }
    if (project.hasProperty('renderOut')) systemProperty 'renderOut', project.property('renderOut')
    if (project.hasProperty('renderPanel')) systemProperty 'renderPanel', project.property('renderPanel')
    if (project.hasProperty('renderTheme')) systemProperty 'renderTheme', project.property('renderTheme')
    if (project.hasProperty('renderBorders')) systemProperty 'renderBorders', project.property('renderBorders')
    // -PupdateGolden rewrites golden files (KeyOutputTest) instead of comparing with them.
    if (project.hasProperty('updateGolden')) systemProperty 'updateGolden', 'true'
}

dependencies {
    implementation libs.appcompat
    implementation libs.core
    implementation libs.preference
    // Inline autofill suggestions (password managers' chips in the toolbar), Android 11+.
    implementation libs.autofill
    implementation libs.material
    implementation libs.recyclerview
    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.espresso.core
}
