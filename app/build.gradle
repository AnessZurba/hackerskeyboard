apply plugin: 'com.android.application'

android {
    namespace 'kr.jcb1ee.hackerskeyboard2'
    compileSdkVersion 34
    defaultConfig {
        applicationId 'kr.jcb1ee.hackerskeyboard2.az'
        // Settings screens link to their sub-screens by package; see res/xml/prefs.xml.
        resValue 'string', 'app_package', applicationId
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 2000000
        versionName "v2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }
    signingConfigs {
        release {
            storeFile     file(System.getenv("KEYSTORE_PATH") ?: "release-hackerskeyboard2.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias      System.getenv("KEY_ALIAS") ?: "hackerskeyboard2"
            keyPassword   System.getenv("KEY_PASSWORD") ?: ""
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    productFlavors {
    }
    lintOptions {
        checkReleaseBuilds false
    }
}

task generateVersionResource {
    def versionName = android.defaultConfig.versionName
    def outFile = file("src/main/res/values/auto-version.xml")
    outputs.file outFile
    doLast {
        outFile.text = """<?xml version="1.0" encoding="utf-8"?>
<!-- Auto-generated file, do not edit -->
<resources xmlns:xliff="urn:oasis:names:tc:xliff:document:1.2">
   <string name="auto_version">${versionName}</string>
</resources>
"""
    }
}
preBuild.dependsOn generateVersionResource

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
                (details.requested.name == 'kotlin-stdlib-jdk7' ||
                 details.requested.name == 'kotlin-stdlib-jdk8')) {
            details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:1.8.22")
        }
    }
}

android.testOptions.unitTests.includeAndroidResources = true
// Robolectric downloads its Android runtime jar at test time; pass
// -ProbolectricDeps=<dir holding the jar> to run offline instead.
android.testOptions.unitTests.all {
    if (project.hasProperty('robolectricDeps')) {
        systemProperty 'robolectric.offline', 'true'
        systemProperty 'robolectric.dependency.dir', project.property('robolectricDeps')
    }
    if (project.hasProperty('renderOut')) systemProperty 'renderOut', project.property('renderOut')
    if (project.hasProperty('renderPanel')) systemProperty 'renderPanel', project.property('renderPanel')
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'
    // Inline autofill suggestions (password managers' chips in the toolbar), Android 11+.
    implementation 'androidx.autofill:autofill:1.1.0'
    implementation 'com.google.android.material:material:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
